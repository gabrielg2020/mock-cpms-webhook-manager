name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: "80"
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      issues: ${{ steps.count.outputs.issues }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --output.text.path=stdout --output.sarif.path=golangci-lint.sarif

      - name: Upload results to GitHub code scanning
        if: always() && hashFiles('golangci-lint.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: golangci-lint.sarif
          category: golangci-lint

      - name: Count lint issues
        id: count
        if: always() && hashFiles('golangci-lint.sarif') != ''
        run: echo "issues=$(jq '[.runs[].results[]] | length' golangci-lint.sarif)" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests with the race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce coverage threshold
        id: coverage
        run: |
          grep -v '/cmd/' coverage.out > coverage.internal.out
          total=$(go tool cover -func=coverage.internal.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "total=${total}" >> "$GITHUB_OUTPUT"
          echo "### Coverage: ${total}% (threshold ${COVERAGE_THRESHOLD}%)" >> "$GITHUB_STEP_SUMMARY"
          if ! awk -v total="$total" -v threshold="$COVERAGE_THRESHOLD" 'BEGIN { exit !(total >= threshold) }'; then
            echo "::error::Coverage ${total}% is below the ${COVERAGE_THRESHOLD}% threshold"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  container:
    name: Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE: mock-cpms-webhook-manager:ci
      TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for the runner (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build image for EC2 (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          cache-from: type=gha

      - name: Smoke test the container
        run: |
          docker run --detach --name smoke --publish 8080:8080 \
            --read-only --cap-drop ALL --security-opt no-new-privileges "$IMAGE"

          health_status=""
          for attempt in $(seq 1 10); do
            health_status=$(curl --silent --output /dev/null --write-out '%{http_code}' localhost:8080/healthz || true)
            [ "$health_status" = "204" ] && break
            echo "Attempt ${attempt}: health check returned '${health_status}', retrying"
            sleep 1
          done

          if [ "$health_status" != "204" ]; then
            docker logs smoke
            echo "::error::Health check returned '${health_status}', expected 204"
            exit 1
          fi

          docker stop smoke
          exit_code=$(docker inspect smoke --format '{{.State.ExitCode}}')
          docker logs smoke

          if [ "$exit_code" != "0" ] || ! docker logs smoke 2>&1 | grep --quiet '"msg":"server stopped"'; then
            echo "::error::Container did not shut down gracefully (exit code ${exit_code})"
            exit 1
          fi

      - name: Export image for scanning
        run: docker save "$IMAGE" --output image.tar

      - name: Scan image with Trivy (SARIF for code scanning)
        run: |
          docker run --rm --volume "$PWD:/work" --volume "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
            image --input /work/image.tar --format sarif --output /work/trivy.sarif

      - name: Upload Trivy results to GitHub code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Fail on high or critical vulnerabilities
        run: |
          docker run --rm --volume "$PWD:/work" --volume "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
            image --input /work/image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff deploy/terraform

      - name: Validate each configuration
        run: |
          for directory in deploy/terraform/*/; do
            echo "::group::${directory}"
            terraform -chdir="$directory" init -backend=false -input=false
            terraform -chdir="$directory" validate
            echo "::endgroup::"
          done

      - name: Scan Terraform with Trivy (SARIF for code scanning)
        run: |
          docker run --rm --volume "$PWD:/work" --volume "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
            config --ignorefile /work/.trivyignore.yaml --format sarif --output /work/trivy-config.sarif /work/deploy/terraform

      - name: Upload Terraform scan results to GitHub code scanning
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Fail on misconfigurations
        run: |
          docker run --rm --volume "$PWD:/work" --volume "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
            config --ignorefile /work/.trivyignore.yaml --exit-code 1 /work/deploy/terraform

  report:
    name: Report
    if: always() && github.event_name == 'pull_request'
    needs: [lint, test, vulncheck, workflow-lint, container, terraform]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post CI summary on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LINT_RESULT: ${{ needs.lint.result }}
          LINT_ISSUES: ${{ needs.lint.outputs.issues }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE: ${{ needs.test.outputs.coverage }}
          VULN_RESULT: ${{ needs.vulncheck.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
        run: |
          icon() {
            case "$1" in
              success) echo "✔" ;;
              skipped | cancelled) echo "◯" ;;
              *) echo "✖" ;;
            esac
          }

          body=$(cat <<EOF
          <!-- ci-summary -->
          ### CI results for \`${COMMIT_SHA:0:7}\`

          | Check | Result | Detail |
          |---|---|---|
          | Lint | $(icon "$LINT_RESULT") ${LINT_RESULT} | ${LINT_ISSUES:-unknown} issues (golangci-lint incl. gosec) |
          | Test | $(icon "$TEST_RESULT") ${TEST_RESULT} | Coverage ${COVERAGE:-unknown}% (threshold ${COVERAGE_THRESHOLD}%) |
          | Vulnerability check | $(icon "$VULN_RESULT") ${VULN_RESULT} | govulncheck |
          | Workflow lint | $(icon "$WORKFLOW_LINT_RESULT") ${WORKFLOW_LINT_RESULT} | actionlint + shellcheck |
          | Container | $(icon "$CONTAINER_RESULT") ${CONTAINER_RESULT} | Build (amd64 + arm64), smoke test, Trivy |
          | Terraform | $(icon "$TERRAFORM_RESULT") ${TERRAFORM_RESULT} | fmt, validate, Trivy config |

          [View the full run](${RUN_URL})
          EOF
          )

          comment_id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- ci-summary -->")) | .id' | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${comment_id}" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi

{{ define "title" }}Sorry, there is a problem with the service{{ end }}

{{ define "content" }}
<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <h1 class="govuk-heading-l">Sorry, there is a problem with the service</h1>
    <p class="govuk-body">Try again later.</p>
    {{ if .Page.Reference }}
    <p class="govuk-body">If you report this problem, give the reference <strong>{{ .Page.Reference }}</strong>.</p>
    {{ end }}
  </div>
</div>
{{ end }}
